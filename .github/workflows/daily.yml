name: التقرير اليومي
concurrency:
  group: marsad-daily-${{ github.ref }}
  cancel-in-progress: false
on:
  schedule:
    - cron: "7 6 * * *"   # 06:07 UTC = 08:07 بتوقيت القاهرة (بعد التقرير اليومي بتاع التطبيق القديم بساعتين)
  workflow_dispatch: {}    # زر «Run workflow» للتشغيل اليدوي
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests deep-translator trafilatura
      - run: python daily.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
