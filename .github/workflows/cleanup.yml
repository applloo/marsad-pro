name: تنضيف الملفات القديمة (مرة واحدة)
# شغّله مرة واحدة من Actions ← «تنضيف الملفات القديمة» ← Run workflow.
# بيمسح الملفات اللي ملهاش لازمة في التطبيق، وبعدين بيمسح نفسه. ماتشغلوش غير لو عايز تمسحهم فعلاً.
concurrency:
  group: marsad-cleanup-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: مسح الملفات اللي ملهاش لازمة
        run: |
          git rm -f --ignore-unmatch ntfs_recover.py ghactions.py
          git rm -f --ignore-unmatch RELEASE_PHASE8_*.md PHASE8_*_TEST_REPORT_AR.md
          git rm -f --ignore-unmatch GITHUB_AUTO_SYNC_PHASE8_19.md GITHUB_STREAMLIT_SYNC_PHASE8_8.md
          git rm -f --ignore-unmatch COLAB_FREE_OPTIONAL.md colab_marsad_free.ipynb
          git rm -f --ignore-unmatch .github/workflows/cleanup.yml
          git status --short
      - name: حفظ التغيير
        run: |
          git config user.name "marsad-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "تنضيف الملفات القديمة اللي ملهاش لازمة" || echo "مفيش حاجة تتمسح"
          git push
