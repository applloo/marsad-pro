name: تحديث الأقسام الذكية تلقائياً
# بيشتغل لوحده بعد ما «البحث الشامل» يخلص (مش بيعيد البحث تاني)، أو بزر من التطبيق.
# بيحدّث: ملفات القضايا، رادار التقارير المدفوعة، تجميع الأحداث والكيانات، الإنذار المبكر، صحة المصادر.
concurrency:
  group: marsad-intel-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_run:
    workflows: ["البحث الشامل في كل المصادر"]
    types: [completed]
  workflow_dispatch: {}
jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests deep-translator trafilatura
      - name: تكملة ترجمة العناوين اللي فضلت إنجليزي (جهاز تاني جوجل بيرد عليه)
        continue-on-error: true
        timeout-minutes: 15
        run: python translate_sweep.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
      - name: تحديث ملفات القضايا من نتايج البحث الشامل
        continue-on-error: true
        run: python scheduled_monitor.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
      - name: الرادار المدفوع والتجميع والكيانات والإنذار المبكر وصحة المصادر
        run: python intel_job.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
