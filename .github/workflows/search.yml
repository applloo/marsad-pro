name: البحث الشامل في كل المصادر
concurrency:
  group: marsad-search-${{ github.ref }}
  cancel-in-progress: false
on:
  schedule:
    - cron: "7 9 * * *"   # 09:07 UTC = 11:07 بتوقيت القاهرة (بعد البحث الشامل بتاع التطبيق القديم بساعتين)
  workflow_dispatch: {}    # يُشغَّل بزر من التطبيق (تاب الملفات والخيوط)
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests deep-translator trafilatura
      - run: python search_job.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
