name: Marsad CI
concurrency:
  group: marsad-ci-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m py_compile *.py tests/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
